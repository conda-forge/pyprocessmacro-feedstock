{% set name = "pyprocessmacro" %}
{% set version = "2.2.0" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: c7d6aa4e1060ae9a6335499ec4c823581a82a3c784e85e8af8e4da45d66f6264

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python >=3.7
    - numpy
    - pandas
    - scipy
    - seaborn
    - matplotlib-base

  run:
    - matplotlib-base
    - {{ pin_compatible('numpy') }}
    - {{ pin_compatible('pandas') }}
    - python >=3.7
    - scipy
    - seaborn

test:
  imports:
    - pyprocessmacro

about:
  home: https://github.com/QuentinAndre/pyprocessmacro/
  summary: A Python library for moderation, mediation and conditional process analysis. Based on Andrew F. Hayes Process Macro.
  license: MIT
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - QuentinAndre
